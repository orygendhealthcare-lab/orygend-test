name: Add active navigation highlight

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add active navigation indicator
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css = '''<style id="nav-active-highlight">
          .navbar .nav-link{position:relative;margin:0 .12rem;padding:.55rem .75rem !important;border:1px solid transparent;border-radius:7px;transition:background-color .2s ease,color .2s ease,border-color .2s ease,box-shadow .2s ease;}
          .navbar .nav-link:hover{background:#f7f0e7;color:var(--amber-dark) !important;border-color:#ead9c3;}
          .navbar .nav-link.active{background:#f7f0e7;color:var(--amber-dark) !important;border-color:#ead9c3;font-weight:700;box-shadow:inset 0 -2px 0 var(--amber);}
          .navbar .nav-link.active::after{content:'';position:absolute;left:50%;bottom:3px;width:18px;height:2px;transform:translateX(-50%);background:var(--amber);border-radius:2px;}
          @media(max-width:991.98px){.navbar .nav-link{margin:.12rem 0;}.navbar .nav-link.active::after{left:.75rem;transform:none;width:18px;}}
          </style>'''

          script = '''<script id="nav-active-script">
          document.addEventListener('DOMContentLoaded', function () {
            const current = (window.location.pathname.split('/').pop() || 'index.html').toLowerCase();
            document.querySelectorAll('.navbar .nav-link').forEach(function (link) {
              const href = (link.getAttribute('href') || '').split('#')[0].split('?')[0];
              const target = (href.split('/').pop() || 'index.html').toLowerCase();
              const isHome = (current === '' || current === 'index.html') && (target === '' || target === 'index.html');
              if (isHome || target === current) {
                link.classList.add('active');
                link.setAttribute('aria-current', 'page');
              }
            });
          });
          </script>'''

          changed = []
          for p in Path('.').glob('*.html'):
              text = p.read_text(encoding='utf-8')
              original = text
              if 'id="nav-active-highlight"' not in text:
                  text = text.replace('</head>', css + '\n</head>', 1)
              if 'id="nav-active-script"' not in text:
                  text = text.replace('</body>', script + '\n</body>', 1)
              if text != original:
                  p.write_text(text, encoding='utf-8')
                  changed.append(p.name)

          print('Updated:', ', '.join(changed))
          PY

      - name: Commit navigation update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Highlight current page in navigation [skip ci]"
          git push
