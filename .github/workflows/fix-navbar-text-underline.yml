name: Apply final navbar text underline
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix navbar active indicator in every page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          pages = [Path(x) for x in ['index.html','services.html','equipment.html','board-repair.html','coverage.html','contact.html'] if Path(x).exists()]
          for p in pages:
              s = p.read_text(encoding='utf-8')
              # Remove the old pseudo-element underline rules, including mobile variants.
              s = re.sub(r'\.navbar \.nav-link\.active::after\{.*?\}', '', s, flags=re.S)
              # Add a text-width underline to the active link. text-decoration follows the glyph width exactly.
              rule = '''.navbar .nav-link.active{background:transparent!important;color:#30373b!important;border:0!important;border-radius:7px!important;box-shadow:none!important;font-weight:600!important;text-decoration-line:underline!important;text-decoration-style:solid!important;text-decoration-color:#be8337!important;text-decoration-thickness:2px!important;text-underline-offset:7px!important;text-decoration-skip-ink:none!important}.navbar .nav-link.active:hover{background:#f6f3ee!important;color:#30373b!important}'''
              s = re.sub(r'\.navbar \.nav-link\.active\{.*?\}\.navbar \.nav-link\.active:hover\{.*?\}', rule, s, count=1, flags=re.S)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/fix-navbar-text-underline.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html services.html equipment.html board-repair.html coverage.html contact.html .github/workflows/fix-navbar-text-underline.yml
          git commit -m 'Use text-width amber underline for active navbar [skip ci]'
          git push