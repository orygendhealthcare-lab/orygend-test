name: Rebuild navbar to Stethix style

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild navigation styles
        shell: python
        run: |
          from pathlib import Path
          import re

          final_css = '''<style id="orygend-stethix-navbar">
          .navbar{background:#fff!important;border-bottom:1px solid #e8e5df!important;box-shadow:none!important;padding-top:0!important;padding-bottom:0!important;min-height:76px}
          .navbar-brand{font-family:Sora,sans-serif!important;font-weight:800!important;font-size:1.18rem!important;color:#182126!important;letter-spacing:-.02em}
          .navbar-brand span{color:#be8337!important}
          .navbar .nav-link{position:relative!important;display:flex!important;align-items:center!important;min-height:76px!important;padding:.25rem .72rem!important;margin:0!important;border:0!important;border-radius:7px!important;background:transparent!important;color:#30373b!important;font-size:.9rem!important;font-weight:500!important;box-shadow:none!important;transition:background-color .18s ease,color .18s ease!important}
          .navbar .nav-link:hover,.navbar .nav-link:focus{background:#f6f3ee!important;color:#30373b!important;border:0!important;box-shadow:none!important}
          .navbar .nav-link.active{background:transparent!important;color:#30373b!important;border:0!important;border-radius:7px!important;box-shadow:none!important;font-weight:600!important}
          .navbar .nav-link.active:hover{background:#f6f3ee!important;color:#30373b!important}
          .navbar .nav-link.active::after{content:""!important;position:absolute!important;left:.72rem!important;right:.72rem!important;bottom:0!important;width:auto!important;height:2px!important;background:#be8337!important;border:0!important;border-radius:2px!important;box-shadow:none!important;transform:none!important}
          .navbar .btn-amber{background:#be8337!important;border:1px solid #be8337!important;color:#fff!important;border-radius:6px!important;padding:.55rem 1rem!important;font-weight:600!important;box-shadow:none!important}
          .navbar .btn-amber:hover,.navbar .btn-amber:focus{background:#9f6a27!important;border-color:#9f6a27!important;color:#fff!important}
          .navbar-toggler{border:0!important;box-shadow:none!important;padding:.35rem!important}
          .navbar-toggler:focus{box-shadow:0 0 0 2px #eee7dd!important}
          .navbar-toggler-icon{background-image:var(--bs-navbar-toggler-icon-bg)!important}
          @media(max-width:991.98px){
            .navbar{min-height:64px!important}
            .navbar-brand{font-size:1.05rem!important}
            .navbar .nav-link{min-height:46px!important;padding:.55rem .25rem!important;border-radius:6px!important}
            .navbar .nav-link.active::after{left:.25rem!important;right:auto!important;width:24px!important;bottom:3px!important}
            .navbar-collapse{padding-top:.5rem!important;padding-bottom:.75rem!important}
            .navbar .btn-amber{margin-top:.5rem!important;width:100%!important}
          }
          </style>'''

          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')

              # Remove the conflicting navigation-specific style blocks created by earlier attempts.
              text = re.sub(r'<style\b[^>]*(?:id=["\'](?:nav-active[^"\']*|active-nav[^"\']*|orygend-stethix-navbar)["\'])[^>]*>[\s\S]*?</style>\s*', '', text, flags=re.I)

              # Remove old active-nav scripts; the existing page script already handles active links.
              text = re.sub(r'<script\b[^>]*id=["\'](?:nav-active-script|active-nav-script-v2)["\'][^>]*>[\s\S]*?</script>\s*', '', text, flags=re.I)

              # Neutralize the old inline active rule so it cannot create a dark box.
              text = re.sub(r'\.nav-link\.active\{[^{}]*\}', '.nav-link.active{background:transparent!important;color:var(--text)!important;font-weight:600!important;border:0!important;box-shadow:none!important;}', text, flags=re.I)

              if '</head>' in text:
                  text = text.replace('</head>', final_css + '\n</head>', 1)

              path.write_text(text, encoding='utf-8')

      - name: Commit rebuilt navbar and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/rebuild-navbar-stethix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' .github/workflows/rebuild-navbar-stethix.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply clean Stethix-style navbar [skip ci]"
          git push
