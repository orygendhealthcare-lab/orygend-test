name: Update hero image

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install optimized hero image
        run: |
          mkdir -p assets
          echo '' | base64 -d > assets/hero-equipment.webp
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("url('assets/hero-page-composite.png')", "url('assets/hero-equipment.webp')")
          p.write_text(s,encoding='utf-8')
          PY
          rm -f assets/hero-equipment.svg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/hero-equipment.webp assets/hero-equipment.svg
          git commit -m 'Use optimized equipment image in homepage hero'
          git push
