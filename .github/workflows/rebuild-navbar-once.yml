name: Rebuild navbar once
on:
  push:
    branches: [rebuild-navbar-clean]
permissions:
  contents: write
jobs:
  rebuild:
    if: ${{ !contains(github.event.head_commit.message, '[navbar-rebuild]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace every existing navbar
        shell: python
        run: |
          from pathlib import Path
          import re
          nav = '''<header class="site-navbar">
            <div class="site-navbar__inner">
              <a class="site-navbar__brand" href="index.html" aria-label="Orygend Healthcare home">Orygend <span>Healthcare</span></a>
              <button class="site-navbar__toggle" type="button" aria-expanded="false" aria-controls="site-navbar-links" aria-label="Open navigation"><span></span></button>
              <nav id="site-navbar-links" class="site-navbar__links" aria-label="Main navigation">
                <a class="site-navbar__link" href="index.html" data-page="index.html">Home</a>
                <a class="site-navbar__link" href="services.html" data-page="services.html">Services</a>
                <a class="site-navbar__link" href="equipment.html" data-page="equipment.html">Equipment</a>
                <a class="site-navbar__link" href="board-repair.html" data-page="board-repair.html">Board Repair</a>
                <a class="site-navbar__link" href="coverage.html" data-page="coverage.html">Coverage</a>
                <a class="site-navbar__link" href="contact.html" data-page="contact.html">Contact</a>
                <a class="site-navbar__cta" href="contact.html#quote">Get a Quote</a>
              </nav>
            </div>
          </header>'''
          script = '''<script id="site-navbar-script">
          (function(){
            var page=(location.pathname.split('/').pop()||'index.html').toLowerCase();
            if(page==='') page='index.html';
            document.querySelectorAll('.site-navbar__link[data-page]').forEach(function(link){
              if(link.dataset.page.toLowerCase()===page){link.classList.add('is-active');link.setAttribute('aria-current','page');}
            });
            var toggle=document.querySelector('.site-navbar__toggle');
            var links=document.getElementById('site-navbar-links');
            if(toggle&&links){toggle.addEventListener('click',function(){var open=toggle.getAttribute('aria-expanded')==='true';toggle.setAttribute('aria-expanded',String(!open));links.classList.toggle('is-open',!open);});links.addEventListener('click',function(e){if(e.target.closest('a')){toggle.setAttribute('aria-expanded','false');links.classList.remove('is-open');}});}
          })();
          </script>'''
          for p in Path('.').glob('*.html'):
            s=p.read_text(encoding='utf-8')
            s=re.sub(r'<nav\b[\s\S]*?</nav>', '', s, count=1, flags=re.I)
            # Remove an old header only when it directly contains the navbar we just removed.
            s=re.sub(r'<header\b[^>]*>[\s\S]*?</header>', lambda m: '' if ('navbar' in m.group(0).lower() or 'nav-link' in m.group(0).lower()) else m.group(0), s, count=1, flags=re.I)
            s=re.sub(r'<style id="site-navbar-reset">[\s\S]*?</style>', '', s, flags=re.I)
            if 'href="nav.css"' not in s:
              s=s.replace('</head>','<link rel="stylesheet" href="nav.css">\n</head>',1)
            # Insert after the info bar if present; otherwise immediately after <body>.
            marker=re.search(r'<div class="info-bar">[\s\S]*?</div>', s, flags=re.I)
            if marker:
              pos=marker.end()
              s=s[:pos]+'\n'+nav+s[pos:]
            else:
              s=s.replace('<body>', '<body>\n'+nav, 1)
            s=s.replace('</body>', script+'\n</body>',1)
            p.write_text(s,encoding='utf-8')
      - name: Remove this workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/rebuild-navbar-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html' nav.css .github/workflows/rebuild-navbar-once.yml
          git commit -m 'Rebuild navbar from scratch [navbar-rebuild]'
          git push
